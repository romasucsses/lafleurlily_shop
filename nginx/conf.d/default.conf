# HTTPS server for lafleurlily.com
server {
    listen 443 ssl;
    server_name lafleurlily.com www.lafleurlily.com;

    ssl_certificate /etc/letsencrypt/live/lafleurlily.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lafleurlily.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK';
    ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html/lily;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://back_lily_shop:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    location /img/ {
        alias /usr/share/nginx/html/media/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_comp_level 3;
    gzip_vary on;
}

# HTTPS server for dolceamorewine.com
server {
    listen 443 ssl;
    server_name dolceamorewine.com www.dolceamorewine.com;

    ssl_certificate /etc/letsencrypt/live/dolceamorewine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dolceamorewine.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK';
    ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html/da;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://back_lily_shop:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /img/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 512;
    gzip_comp_level 9;
    gzip_vary on;
    gzip_buffers 8 64k;
    gzip_proxied any;
    access_log off;
    sendfile on;
    sendfile_max_chunk 512k;
}

