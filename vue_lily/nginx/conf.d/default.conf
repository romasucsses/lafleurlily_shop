# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name lafleurlily.com www.lafleurlily.com;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other requests to HTTPS
    location / {
       return 301 https://$host$request_uri;
    }

  
}

# HTTPS server
server {
    listen 443 ssl;
    server_name lafleurlily.com www.lafleurlily.com;

    # SSL certificate settings
    
    ssl_certificate /etc/letsencrypt/live/lafleurlily.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lafleurlily.com/privkey.pem;

    # SSL settings (add more settings as needed)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK';
    # ssl_prefer_server_ciphers on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://back_lily_shop:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Proto https;  # Forward the X-Forwarded-Proto header
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
    }

    location /static/ {
        alias /usr/share/nginx/html/static/;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
    }
}
